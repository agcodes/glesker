name: Build, Test & Deploy to OVH

on:
  push:
    branches: [main, dev]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      # Checkout le code
      - name: Checkout
        uses: actions/checkout@v4

      # Configurer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Installer les dependances
      - name: Install dependencies
        run: npm ci

      # Audit de sécurité (npm audit)
      - name: Security Audit (npm audit)
        run: npm audit --audit-level=critical

      - name: Auto-fix vulnerabilities
        run: npm audit fix
      
        # Build
      - name: Build
        run: npm run build

      # Tests
      - name: Tests
        run: npm run test

      # Deploiement sur OVH (FTP)
      - name: Deploy to OVH via FTP
        if: github.ref == 'refs/heads/main'  # ⬅ Condition : déploiement uniquement sur main
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./glesker-app/dist/glesker-app
          server-dir: /glesker/