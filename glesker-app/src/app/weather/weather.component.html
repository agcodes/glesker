<div class="container py-4">
  <header class="text-center mb-4">
    <h1 class="display-4 mb-3">
      <img src="frog-svgrepo-com.svg" alt="Grenouille" class="frog-logo" style="height: 1.5em; width: 1.5em; vertical-align: -0.25em;" />
      Météo
    </h1>
    <p class="lead mb-3">La pluie et le beau temps</p>

    <div class="input-group mb-3 justify-content-center" style="max-width: 400px; margin: 0 auto">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (keyup.enter)="searchCity()"
        placeholder="Rechercher une ville en France..."
        class="form-control"
        [disabled]="isSearching"
      />
      <button (click)="searchCity()" class="btn btn-primary" [disabled]="isSearching">
        <span *ngIf="!isSearching"><i class="bi bi-search"></i></span>
        <span *ngIf="isSearching" class="spinner-border spinner-border-sm"></span>
      </button>
    </div>

    <div *ngIf="searchError" class="alert alert-warning alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i> {{ searchError }}
      <button type="button" class="btn-close" (click)="searchError = null"></button>
    </div>

    <div class="d-flex justify-content-center gap-2 mb-3">
      <button (click)="refresh()" class="btn btn-outline-secondary" [disabled]="isLoading">
        <span *ngIf="!isLoading"><i class="bi bi-arrow-clockwise"></i> Rafraîchir</span>
        <span *ngIf="isLoading"
          ><span class="spinner-border spinner-border-sm me-2"></span>Chargement...</span
        >
      </button>

      <button (click)="themeService.toggleTheme()" class="btn btn-outline-secondary" title="Changer de thème">
        @if (themeService.theme() === 'light') {
          <i class="bi bi-moon-fill"></i>
        } @else {
          <i class="bi bi-sun-fill"></i>
        }
      </button>
    </div>
  </header>

  <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem">
      <span class="visually-hidden">Chargement...</span>
    </div>
    <p class="mt-3">Chargement des données météo...</p>
  </div>

  <div *ngIf="!isLoading && weatherData.length === 0" class="alert alert-info">
    <i class="bi bi-info-circle-fill me-2"></i> Aucune donnée météo disponible
  </div>

  <div
    *ngIf="!isLoading && weatherData.length > 0"
    class="row row-cols-1 row-cols-md-2 row-cols-lg-2 g-3 mt-2"
  >
    <div *ngFor="let item of weatherData" class="col">
      <app-weather-card
        [item]="item"
        [dayIndex]="dayIndexes[item.city ?? '']"
        [defaultDayIndex]="DEFAULT_DAY_INDEX"
        (removeCity)="removeCity($event)"
        (dayIndexChange)="updateDayIndex($event)"
      ></app-weather-card>
    </div>
  </div>

  <footer class="text-center mt-4 text-muted small py-3">
    <p>
      Données fournies par
      <a href="https://open-meteo.com" target="_blank" class="text-decoration-none">Open-Meteo</a>
    </p>
  </footer>
</div>
