@if (showModal) {
  <div class="modal" style="display: block; background: rgba(0,0,0,0.5);" (click)="closeModal()">
    <div class="modal-dialog modal-lg modal-dialog-centered" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-thermometer-half me-2"></i>
            Historique des températures - {{ cityName }}
          </h5>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        
        <div class="modal-body">
          @if (isLoading) {
            <div class="text-center my-5">
              <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Chargement...</span>
              </div>
              <p class="mt-3">Chargement des données...</p>
            </div>
          } @else {
            <div class="chart-container my-3" style="height: 300px;">
              <canvas #chartCanvas></canvas>
            </div>
          }
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()" [disabled]="isLoading">
            Fermer
          </button>
        </div>
      </div>
    </div>
  </div>
}
